name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: |
          go build -o bin/hookprobe ./cmd/hookprobe
          go build -o bin/vulnerable ./demo/vulnerable
          go build -o bin/fixed ./demo/fixed

      - name: Fixed receiver passes
        run: |
          bin/fixed -addr :8082 &
          for i in $(seq 1 20); do curl -s localhost:8082/__hookprobe/events/x >/dev/null && break; sleep 0.25; done
          bin/hookprobe --scheme hook --secret demo-secret --json-file fixed.json http://localhost:8082/webhook
          test "$(jq '.passed' fixed.json)" = true

      - name: Vulnerable receiver fails
        run: |
          bin/vulnerable -addr :8081 &
          for i in $(seq 1 20); do curl -s localhost:8081/__hookprobe/events/x >/dev/null && break; sleep 0.25; done
          set +e
          bin/hookprobe --scheme hook --secret demo-secret --json http://localhost:8081/webhook > vulnerable.json
          code=$?
          set -e
          echo "exit code $code"
          test "$code" -eq 1
          test "$(jq '.summary.fail' vulnerable.json)" -eq 6

  action:
    # Runs the action from this checkout against the fixed demo receiver.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Start fixed receiver
        run: |
          go build -o /tmp/fixed ./demo/fixed
          /tmp/fixed -addr :8082 &
          for i in $(seq 1 40); do curl -s localhost:8082/__hookprobe/events/x >/dev/null && break; sleep 0.25; done

      - name: Probe with the action
        id: probe
        uses: ./
        with:
          url: http://localhost:8082/webhook
          scheme: hook
          secret: demo-secret
          version: ${{ github.sha }}
          args: --skip slow-body --body-file examples/stripe-event.json

      - name: Check outputs
        run: |
          test "${{ steps.probe.outputs.passed }}" = true
          jq -e '.passed' "${{ steps.probe.outputs.report }}"
